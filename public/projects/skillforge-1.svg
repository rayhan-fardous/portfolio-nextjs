<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514" />
      <stop offset="50%" stop-color="#190a38" />
      <stop offset="100%" stop-color="#2d1254" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" rx="24" fill="url(#bgSF)" />

  <!-- Top Glass Bar -->
  <rect x="40" y="30" width="1120" height="60" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" />
  <circle cx="75" cy="60" r="8" fill="#ef4444" />
  <circle cx="100" cy="60" r="8" fill="#eab308" />
  <circle cx="125" cy="60" r="8" fill="#22c55e" />
  <text x="160" y="65" fill="#c084fc" font-family="system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="1">SKILLFORGE AI — CAREER ROADMAP &amp; SKILL GENERATOR</text>

  <!-- Left Main Panel -->
  <rect x="40" y="110" width="720" height="535" rx="20" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08" />
  <text x="75" y="155" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Full-Stack Engineer AI Career Path</text>
  <text x="75" y="185" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="14">AI-generated step-by-step milestones &amp; core skills</text>

  <!-- Timeline Nodes -->
  <circle cx="100" cy="250" r="16" fill="#a855f7" />
  <text x="95" y="255" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">1</text>
  <rect x="140" y="225" width="580" height="50" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#a855f7" stroke-opacity="0.4" />
  <text x="160" y="255" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Frontend Foundations (TypeScript, React 19, Next.js App Router)</text>

  <line x1="100" y1="266" x2="100" y2="350" stroke="#a855f7" stroke-width="4" stroke-dasharray="6,6" />

  <circle cx="100" cy="360" r="16" fill="#a855f7" />
  <text x="95" y="365" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">2</text>
  <rect x="140" y="335" width="580" height="50" rx="12" fill="#ffffff" fill-opacity="0.03" />
  <text x="160" y="365" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="15">Backend &amp; Databases (Node.js, Express, PostgreSQL / MongoDB)</text>

  <line x1="100" y1="376" x2="100" y2="460" stroke="#a855f7" stroke-width="4" stroke-dasharray="6,6" />

  <circle cx="100" cy="470" r="16" fill="#a855f7" opacity="0.6" />
  <text x="95" y="475" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">3</text>
  <rect x="140" y="445" width="580" height="50" rx="12" fill="#ffffff" fill-opacity="0.03" />
  <text x="160" y="475" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="15">System Architecture &amp; Cloud Deployment (Docker, Redis, Vercel)</text>

  <!-- Right Panel AI Prompt Console -->
  <rect x="780" y="110" width="380" height="535" rx="20" fill="#04020a" stroke="#a855f7" stroke-opacity="0.3" />
  <rect x="780" y="110" width="380" height="45" rx="20" fill="url(#purpleGlow)" opacity="0.2" />
  <text x="805" y="138" fill="#f3e8ff" font-family="monospace" font-size="14">🤖 AI Assistant Engine</text>

  <rect x="805" y="180" width="330" height="90" rx="12" fill="#ffffff" fill-opacity="0.04" />
  <text x="825" y="210" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Prompt:</text>
  <text x="825" y="235" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="13">"Create a 4-week roadmap to master Next.js 15 &amp; MongoDB."</text>

  <rect x="805" y="290" width="330" height="320" rx="12" fill="#090514" border="1" />
  <text x="825" y="325" fill="#4ade80" font-family="monospace" font-size="12">✓ Generating roadmap...</text>
  <text x="825" y="355" fill="#d8b4fe" font-family="monospace" font-size="12">• Week 1: Server Components</text>
  <text x="825" y="385" fill="#d8b4fe" font-family="monospace" font-size="12">• Week 2: BetterAuth Setup</text>
  <text x="825" y="415" fill="#d8b4fe" font-family="monospace" font-size="12">• Week 3: API Route Optimization</text>
  <text x="825" y="445" fill="#d8b4fe" font-family="monospace" font-size="12">• Week 4: Vercel Deployment</text>
</svg>
