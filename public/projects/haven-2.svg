<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31103f" />
    </linearGradient>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" rx="24" fill="url(#bgGrad)" />

  <!-- Top Glass Bar -->
  <rect x="40" y="30" width="1120" height="60" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" />
  <circle cx="75" cy="60" r="8" fill="#ef4444" />
  <circle cx="100" cy="60" r="8" fill="#eab308" />
  <circle cx="125" cy="60" r="8" fill="#22c55e" />
  <text x="160" y="66" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="16" font-weight="600" letter-spacing="1">HAVEN STAYS — HOST DASHBOARD &amp; ANALYTICS</text>

  <!-- Sidebar -->
  <rect x="40" y="110" width="220" height="535" rx="16" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08" />
  <rect x="60" y="140" width="180" height="40" rx="10" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-opacity="0.4" />
  <text x="100" y="165" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Overview</text>
  <rect x="60" y="195" width="180" height="40" rx="10" fill="#ffffff" fill-opacity="0.02" />
  <text x="100" y="220" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="14">Listings (14)</text>
  <rect x="60" y="250" width="180" height="40" rx="10" fill="#ffffff" fill-opacity="0.02" />
  <text x="100" y="275" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="14">Reservations</text>
  <rect x="60" y="305" width="180" height="40" rx="10" fill="#ffffff" fill-opacity="0.02" />
  <text x="100" y="330" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="14">Earnings &amp; Payouts</text>

  <!-- Main Content Cards Grid -->
  <!-- Metric Card 1 -->
  <rect x="280" y="110" width="275" height="130" rx="16" fill="url(#cardGlow)" stroke="#ffffff" stroke-opacity="0.12" />
  <text x="305" y="145" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="14">Monthly Revenue</text>
  <text x="305" y="185" fill="#ffffff" font-family="system-ui, sans-serif" font-size="32" font-weight="700">$24,850</text>
  <text x="305" y="215" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="600">↑ +18.4% from last month</text>

  <!-- Metric Card 2 -->
  <rect x="575" y="110" width="275" height="130" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" />
  <text x="600" y="145" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="14">Occupancy Rate</text>
  <text x="600" y="185" fill="#ffffff" font-family="system-ui, sans-serif" font-size="32" font-weight="700">92.4%</text>
  <text x="600" y="215" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Peak Season Status</text>

  <!-- Metric Card 3 -->
  <rect x="870" y="110" width="290" height="130" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" />
  <text x="895" y="145" fill="#d1d5db" font-family="system-ui, sans-serif" font-size="14">Avg Rating</text>
  <text x="895" y="185" fill="#ffffff" font-family="system-ui, sans-serif" font-size="32" font-weight="700">4.96 ★</text>
  <text x="895" y="215" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="13">Based on 340+ reviews</text>

  <!-- Chart & Calendar Section -->
  <rect x="280" y="260" width="570" height="385" rx="16" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08" />
  <text x="310" y="295" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Booking Volume Trends</text>
  
  <!-- Bar chart visual -->
  <rect x="330" y="480" width="40" height="120" rx="6" fill="url(#barGrad)" opacity="0.7" />
  <rect x="400" y="420" width="40" height="180" rx="6" fill="url(#barGrad)" opacity="0.85" />
  <rect x="470" y="380" width="40" height="220" rx="6" fill="url(#barGrad)" opacity="0.95" />
  <rect x="540" y="340" width="40" height="260" rx="6" fill="url(#barGrad)" />
  <rect x="610" y="360" width="40" height="240" rx="6" fill="url(#barGrad)" opacity="0.9" />
  <rect x="680" y="400" width="40" height="200" rx="6" fill="url(#barGrad)" opacity="0.8" />
  <rect x="750" y="330" width="40" height="270" rx="6" fill="url(#barGrad)" />

  <!-- Recent Bookings Panel -->
  <rect x="870" y="260" width="290" height="385" rx="16" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08" />
  <text x="895" y="295" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Recent Guests</text>

  <!-- Guest item 1 -->
  <circle cx="915" cy="340" r="18" fill="#f43f5e" opacity="0.3" />
  <text x="945" y="338" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Sophia Bennett</text>
  <text x="945" y="354" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Villa Lumina • Jul 24-28</text>

  <!-- Guest item 2 -->
  <circle cx="915" cy="410" r="18" fill="#6366f1" opacity="0.3" />
  <text x="945" y="408" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Marcus Chen</text>
  <text x="945" y="424" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Alpine Chalet • Aug 02-09</text>

  <!-- Guest item 3 -->
  <circle cx="915" cy="480" r="18" fill="#10b981" opacity="0.3" />
  <text x="945" y="478" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Elena Rostova</text>
  <text x="945" y="494" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Ocean View Penthouse</text>
</svg>
