<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180509" />
      <stop offset="50%" stop-color="#2d0b13" />
      <stop offset="100%" stop-color="#4a0e1c" />
    </linearGradient>
    <linearGradient id="roseGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" rx="24" fill="url(#bgBC)" />

  <rect x="40" y="30" width="1120" height="60" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" />
  <circle cx="75" cy="60" r="8" fill="#ef4444" />
  <circle cx="100" cy="60" r="8" fill="#eab308" />
  <circle cx="125" cy="60" r="8" fill="#22c55e" />
  <text x="160" y="65" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="1">BLOOD CONNECT — EMERGENCY DONOR SEARCH &amp; PLATFORM</text>

  <!-- Emergency Banner -->
  <rect x="40" y="110" width="1120" height="150" rx="20" fill="url(#roseGlow)" opacity="0.9" />
  <text x="80" y="170" fill="#ffffff" font-family="system-ui, sans-serif" font-size="32" font-weight="800">Need Urgent Blood? Search Donors Instantly</text>
  <text x="80" y="205" fill="#ffe4e6" font-family="system-ui, sans-serif" font-size="15">Search by Blood Group, District &amp; Upazila in real time across Bangladesh.</text>

  <!-- Search Card -->
  <rect x="40" y="285" width="1120" height="360" rx="20" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08" />
  <text x="75" y="330" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Active Emergency Requests</text>

  <rect x="75" y="360" width="340" height="240" rx="16" fill="#0f0206" stroke="#f43f5e" stroke-opacity="0.4" />
  <rect x="100" y="385" width="60" height="30" rx="8" fill="#ef4444" />
  <text x="113" y="405" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">O+</text>
  <text x="175" y="405" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Dhaka Medical College</text>
  <text x="100" y="445" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="13">Location: Ramna, Dhaka</text>
  <text x="100" y="475" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Urgent: 2 Bags Required</text>

  <rect x="440" y="360" width="340" height="240" rx="16" fill="#0f0206" stroke="#ffffff" stroke-opacity="0.1" />
  <rect x="465" y="385" width="60" height="30" rx="8" fill="#ef4444" />
  <text x="476" y="405" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">AB-</text>
  <text x="540" y="405" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Square Hospital</text>
  <text x="465" y="445" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="13">Location: Panthapath, Dhaka</text>
  <text x="465" y="475" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Urgent: 1 Bag Required</text>
</svg>
